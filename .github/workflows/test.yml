name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 python3-numpy python3-requests xvfb xauth xdotool
      - run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Isolated GUI test
        env:
          VOICE_ISLAND_ISOLATED_TEST: '1'
        run: xvfb-run -a /usr/bin/python3 tests/gui_smoke.py
